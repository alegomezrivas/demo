name: demo
description: "Flutter portfolio app"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  reactive_forms: ^18.2.2
  stacked: ^3.5.0

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mockito: ^5.8.1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Single place (with app_typography.dart) to change the app font.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
