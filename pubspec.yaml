name: demo
description: "Flutter portfolio app"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  get_it: ^8.3.0
  go_router: ^17.5.0
  intl: ^0.20.2
  jailbreak_root_detection: ^1.2.0+1
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  meta: ^1.17.0
  reactive_forms: ^18.2.2
  screen_protector: ^1.5.3
  shared_preferences: ^2.5.6
  stacked: ^3.5.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mockito: ^5.6.4
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Single place (with app_typography.dart) to change the app font.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
