name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to the same branch/PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Flutter version lives in .fvmrc (FVM) so CI and developers match.
      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated code is committed: it must match what the generators produce.
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- . ':(exclude)pubspec.lock' \
            || (echo "::error::Generated files are out of date. Run build_runner and gen-l10n, then commit." && exit 1)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage gate (domain and ViewModels >= 80%)
        run: tool/check_coverage.sh coverage/lcov.info 80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: outdated packages must not block a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - run: flutter pub get

      - name: Outdated and discontinued packages
        run: flutter pub outdated

  android-release-build:
    name: Android release build (R8 + obfuscation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - run: flutter pub get

      # Builds an UNSIGNED bundle with the production example config, only to
      # prove that R8 shrinking and obfuscation do not break the build. No
      # signing material is used or needed.
      - name: Build release bundle
        run: |
          flutter build appbundle --release --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define-from-file=config/prod.example.json

      - name: Upload symbols (needed to read obfuscated crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info
          path: build/debug-info
          retention-days: 14

  ios-release-build:
    name: iOS release build (no codesign, obfuscation)
    # macOS runners are billed at a higher rate: run only after a push to
    # master (the workflow's only push trigger) or when started by hand, and
    # only once `verify` has passed. Pull requests skip it.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Read the Flutter version from .fvmrc
        id: fvm
        run: echo "flutter=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true

      - run: flutter pub get

      # Compiles the app for devices without signing, only to prove that the
      # iOS project, the CocoaPods dependencies and obfuscation build. It uses
      # the production example config and needs no certificates or profiles.
      - name: Build release app (no codesign)
        run: |
          flutter build ios --release --no-codesign --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define-from-file=config/prod.example.json

      - name: Upload symbols (needed to read obfuscated crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-info
          path: build/debug-info
          retention-days: 14
